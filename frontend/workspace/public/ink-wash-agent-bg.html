<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水墨智能体背景</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #efe6d4;
        --ink-0: #11100e;
        --ink-1: #2b2924;
        --ink-2: #5c574e;
        --ink-3: #8f8779;
        --mist: rgba(17, 16, 14, 0.08);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        overflow: hidden;
        background: var(--paper);
        color: var(--ink-1);
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
      }

      #stage {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .veil {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(120% 80% at 50% 18%, transparent 42%, rgba(17, 16, 14, 0.16) 100%),
          linear-gradient(180deg, rgba(239, 230, 212, 0.08), transparent 28%, transparent 72%, rgba(17, 16, 14, 0.1));
      }

      .mark {
        position: fixed;
        left: 48px;
        bottom: 40px;
        max-width: min(420px, 46vw);
        pointer-events: none;
      }
      .mark p {
        margin: 0;
        font-size: clamp(28px, 3.4vw, 44px);
        font-weight: 600;
        letter-spacing: 0.18em;
        line-height: 1.15;
      }
      .mark span {
        display: block;
        margin-top: 10px;
        color: var(--ink-2);
        font-size: 13px;
        letter-spacing: 0.22em;
      }

      .tweaks {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 228px;
        padding: 16px 16px 14px;
        border: 1px solid rgba(17, 16, 14, 0.12);
        background: color-mix(in srgb, var(--paper) 82%, transparent);
        backdrop-filter: blur(10px);
        color: var(--ink-1);
      }
      .tweaks[hidden] {
        display: none;
      }
      .tweaks h2 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      .tweaks label {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .tweaks input[type="range"] {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: var(--ink-1);
      }
      .tweaks button {
        width: 100%;
        margin-top: 4px;
        padding: 7px 0;
        border: 1px solid var(--ink-1);
        background: transparent;
        color: var(--ink-1);
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.16em;
        cursor: pointer;
      }
      .tweaks button:hover {
        background: var(--ink-0);
        color: var(--paper);
      }
      .toggle {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(17, 16, 14, 0.2);
        background: color-mix(in srgb, var(--paper) 80%, transparent);
        color: var(--ink-1);
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div class="veil"></div>
    <div class="mark">
      <p>墨未干</p>
      <span>点击落墨 · 可嵌入智能体背景</span>
    </div>
    <button class="toggle" id="toggle" type="button" aria-label="Tweaks">调</button>
    <aside class="tweaks" id="tweaks" hidden>
      <h2>Tweaks</h2>
      <label
        >墨点密度 <b id="dVal">0.4</b>
        <input id="density" type="range" min="0.15" max="1.6" step="0.05" value="0.4" />
      </label>
      <label
        >墨晕 <b id="bVal">0.6</b>
        <input id="bloom" type="range" min="0" max="2" step="0.1" value="0.6" />
      </label>
      <label
        >底图浓度 <b id="pVal">0.78</b>
        <input id="plate" type="range" min="0.2" max="1" step="0.02" value="0.78" />
      </label>
      <button id="pause" type="button">暂停</button>
    </aside>

    <script>
      const canvas = document.getElementById("stage")
      const ctx = canvas.getContext("2d", { alpha: false })
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches

      const state = {
        density: reduced ? 0.25 : 0.4,
        bloom: reduced ? 0.35 : 0.6,
        plate: 0.78,
        paused: false,
        wind: 0.12,
      }

      const plate = new Image()
      plate.src = "./ink-wash-agent-bg.png?v=yingke"
      let plateReady = false
      plate.onload = () => {
        plateReady = true
      }

      const grain = document.createElement("canvas")
      const specks = []
      const blooms = []
      let w = 0
      let h = 0
      let last = performance.now()

      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2)
        w = innerWidth
        h = innerHeight
        canvas.width = Math.floor(w * dpr)
        canvas.height = Math.floor(h * dpr)
        canvas.style.width = w + "px"
        canvas.style.height = h + "px"
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
        bakeGrain()
        seed(true)
      }

      function bakeGrain() {
        grain.width = 256
        grain.height = 256
        const g = grain.getContext("2d")
        const data = g.createImageData(256, 256)
        for (let i = 0; i < data.data.length; i += 4) {
          const n = 210 + Math.random() * 36
          data.data[i] = n
          data.data[i + 1] = n - 6
          data.data[i + 2] = n - 14
          data.data[i + 3] = 255
        }
        g.putImageData(data, 0, 0)
      }

      function seed(reset) {
        if (reset) specks.length = 0
        const speckN = Math.round(((w * h) / 36000) * state.density)
        while (specks.length < speckN) specks.push(makeSpeck())
        if (specks.length > speckN) specks.length = speckN
      }

      function makeSpeck(x, y) {
        return {
          x: x ?? Math.random() * w,
          y: y ?? Math.random() * h,
          r: 0.5 + Math.random() * 1.4,
          a: 0.1 + Math.random() * 0.22,
          vx: (Math.random() - 0.5) * 0.12,
          vy: -0.03 - Math.random() * 0.08,
          life: 10 + Math.random() * 18,
        }
      }

      function drop(x, y, force) {
        const n = force ? 0.7 : 0.4 + Math.random() * 0.3
        blooms.push({
          x,
          y,
          r: 10,
          max: (50 + Math.random() * 70) * n * (0.5 + state.bloom * 0.5),
          a: 0.22 * Math.max(0.25, state.bloom),
          grow: 28 + Math.random() * 18,
        })
        const extra = Math.round(3 * state.density)
        for (let i = 0; i < extra; i++) {
          const speck = makeSpeck(x + (Math.random() - 0.5) * 18, y + (Math.random() - 0.5) * 18)
          speck.vy -= Math.random() * 0.12
          specks.push(speck)
        }
      }

      function drawPlate() {
        ctx.fillStyle = "#efe6d4"
        ctx.fillRect(0, 0, w, h)
        ctx.globalAlpha = 0.18
        ctx.fillStyle = ctx.createPattern(grain, "repeat")
        ctx.fillRect(0, 0, w, h)
        ctx.globalAlpha = 1
        if (plateReady) {
          const iw = plate.naturalWidth
          const ih = plate.naturalHeight
          const scale = Math.max(w / iw, h / ih)
          const dw = iw * scale
          const dh = ih * scale
          ctx.globalAlpha = state.plate
          ctx.drawImage(plate, (w - dw) / 2, (h - dh) / 2, dw, dh)
          ctx.globalAlpha = 1
        } else {
          washFallback()
        }
      }

      function washFallback() {
        const bands = [
          [0.12, 0.78, 0.72, 0.16, 0.12],
          [0.62, 0.86, 0.5, 0.12, 0.1],
          [0.82, 0.28, 0.38, 0.1, 0.08],
        ]
        for (const [x, y, rx, , a] of bands) {
          const g = ctx.createRadialGradient(w * x, h * y, 0, w * x, h * y, Math.max(w, h) * rx)
          g.addColorStop(0, `rgba(28, 26, 22, ${a})`)
          g.addColorStop(1, "rgba(28, 26, 22, 0)")
          ctx.fillStyle = g
          ctx.fillRect(0, 0, w, h)
        }
      }

      function step(now) {
        const dt = Math.min(0.033, (now - last) / 1000)
        last = now
        drawPlate()
        if (!state.paused) {
          state.wind = Math.sin(now * 0.00018) * 0.18
          for (const s of specks) {
            s.x += (s.vx + state.wind) * 60 * dt
            s.y += s.vy * 60 * dt
            s.life -= dt
            if (s.x < -8) s.x = w + 8
            if (s.x > w + 8) s.x = -8
            if (s.y < -8 || s.life < 0) Object.assign(s, makeSpeck(Math.random() * w, h + 6))
          }
          for (let i = blooms.length - 1; i >= 0; i--) {
            const b = blooms[i]
            b.r += b.grow * dt
            b.a *= 0.985
            if (b.r > b.max || b.a < 0.01) blooms.splice(i, 1)
          }
          if (state.bloom > 0 && Math.random() < 0.003 * state.bloom) {
            drop(Math.random() * w, h * (0.4 + Math.random() * 0.45), false)
          }
        }

        ctx.save()
        ctx.globalCompositeOperation = "source-over"
        for (const b of blooms) {
          const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r)
          g.addColorStop(0, `rgba(12, 11, 9, ${b.a})`)
          g.addColorStop(0.45, `rgba(12, 11, 9, ${b.a * 0.45})`)
          g.addColorStop(1, "rgba(12, 11, 9, 0)")
          ctx.fillStyle = g
          ctx.beginPath()
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2)
          ctx.fill()
        }
        ctx.restore()

        ctx.fillStyle = "#1a1814"
        for (const s of specks) {
          ctx.globalAlpha = s.a
          ctx.beginPath()
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2)
          ctx.fill()
        }
        ctx.globalAlpha = 1
        requestAnimationFrame(step)
      }

      canvas.addEventListener("pointerdown", (e) => {
        drop(e.clientX, e.clientY, true)
      })
      addEventListener("resize", resize)

      const tweaks = document.getElementById("tweaks")
      const toggle = document.getElementById("toggle")
      toggle.addEventListener("click", () => {
        const open = tweaks.hidden
        tweaks.hidden = !open
        toggle.hidden = open
      })
      document.getElementById("density").addEventListener("input", (e) => {
        state.density = Number(e.target.value)
        document.getElementById("dVal").textContent = state.density.toFixed(2)
        seed(false)
      })
      document.getElementById("bloom").addEventListener("input", (e) => {
        state.bloom = Number(e.target.value)
        document.getElementById("bVal").textContent = state.bloom.toFixed(1)
      })
      document.getElementById("plate").addEventListener("input", (e) => {
        state.plate = Number(e.target.value)
        document.getElementById("pVal").textContent = state.plate.toFixed(2)
      })
      document.getElementById("pause").addEventListener("click", (e) => {
        state.paused = !state.paused
        e.target.textContent = state.paused ? "继续" : "暂停"
      })

      window.InkWash = {
        drop,
        set(partial) {
          Object.assign(state, partial)
          seed(false)
        },
      }

      resize()
      requestAnimationFrame(step)
    </script>
  </body>
</html>
